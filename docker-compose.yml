
services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: clipstream-surrealdb
    volumes:
      - ./data/surrealdb:/data
    command: start --log info --user root --pass root file://data/clipstream.db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: clipstream-redis
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ipfs:
    image: ipfs/kubo:latest
    container_name: clipstream-ipfs
    ports: []
    volumes:
      - ./data/ipfs:/data/ipfs
    environment:
      - IPFS_PROFILE=server
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ipfs id || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    container_name: clipstream-backend
    ports: []
    env_file:
      - .env
    environment:
      - SURREALDB_URL=ws://surrealdb:8000/rpc
      - REDIS_URL=redis://redis:6379/0
      - IPFS_URL=/dns/ipfs/tcp/5001/http
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./backend:/app
      - ./data/uploads:/app/uploads
    depends_on:
      - surrealdb
      - redis
      - ipfs
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8080

  celery-worker:
    build: ./backend
    container_name: clipstream-celery-worker
    environment:
      - SURREALDB_URL=ws://surrealdb:8000/rpc
      - REDIS_URL=redis://redis:6379/0
      - IPFS_URL=/dns/ipfs/tcp/5001/http
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./backend:/app
      - ./data/uploads:/app/uploads
    depends_on:
      - backend
    restart: unless-stopped
    command: celery -A workers.video_processor worker --loglevel=info --concurrency=2

  celery-beat:
    build: ./backend
    container_name: clipstream-celery-beat
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    restart: unless-stopped
    command: celery -A workers.video_processor beat --loglevel=info

  flower:
    build: ./backend
    container_name: clipstream-flower
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
    command: celery -A workers.video_processor flower --port=5555

volumes:
  surrealdb-data:
  redis-data:
  ipfs-data:
