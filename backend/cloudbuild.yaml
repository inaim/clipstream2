steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/clipstream-backend:$SHORT_SHA', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/clipstream-backend:$SHORT_SHA']

  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        # Deploy to Cloud Run. Replace REGION with your desired region or
        # provide substitution when triggering the build.
        REGION=${_REGION:-us-central1}
        SERVICE_NAME=${_SERVICE_NAME:-clipstream-backend}
        IMAGE=gcr.io/$PROJECT_ID/clipstream-backend:$SHORT_SHA

        # NOTE: For sensitive environment variables, use Secret Manager and
        # gcloud secrets versions access --secret=... and set them via
        # --set-secrets. This example uses simple env var injection which is
        # fine for non-sensitive values during testing.
        # Cloud Run automatically sets the PORT env var for containers; do not set it here.
        gcloud run deploy "$SERVICE_NAME" \
          --image "$IMAGE" \
          --region "$REGION" \
          --platform managed \
          --allow-unauthenticated

substitutions:
  _REGION: "us-central1"
  _SERVICE_NAME: "clipstream-backend"

timeout: "1200s"
