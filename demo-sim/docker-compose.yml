version: '3.8'

services:
  origin:
    image: nginx:stable
    ports:
      - "8082:80"
    volumes:
      - ./origin:/usr/share/nginx/html
      - ./origin/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./storage/uploads:/usr/share/nginx/html/uploads
    networks:
      - demo-net

  backend:
    build: ./backend
    ports:
      - "8002:8000"
    volumes:
      - ./storage:/app/storage
    networks:
      - demo-net

  cdn:
    build: ./cdn
    ports:
      - "8003:80"
    depends_on:
      - origin
      - backend
      - transcoder
    networks:
      - demo-net

  transcoder:
    build: ./transcoder
    volumes:
      - ./storage:/work/storage
    depends_on:
      - backend
      - origin
    networks:
      - demo-net

networks:
  demo-net:
    driver: bridge
