<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Mobile Optimization -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ClipStream" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme Colors -->
    <meta name="theme-color" content="#2563eb" />
    <meta name="msapplication-TileColor" content="#2563eb" />

    <!-- SEO Meta Tags -->
    <meta name="description" content="ClipStream - Hybrid AI-Driven Decentralized Video Platform. TikTok-like experience with Web3 efficiency." />
    <meta name="keywords" content="video platform, social media, AI, Web3, decentralized, TikTok alternative" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://clipstream.app/" />
    <meta property="og:title" content="ClipStream - AI-Driven Video Platform" />
    <meta property="og:description" content="Experience TikTok-like speed with Web3 efficiency. AI recommendations, creator profit-sharing, and true ownership." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://clipstream.app/" />
    <meta property="twitter:title" content="ClipStream - AI-Driven Video Platform" />
    <meta property="twitter:description" content="Experience TikTok-like speed with Web3 efficiency." />
    <meta property="twitter:image" content="/og-image.png" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>ClipStream - AI-Driven Video Platform</title>

  <!-- Service Worker Registration (production only) -->
  <script type="module">
      try {
        const isProd = (import.meta && import.meta.env && import.meta.env.MODE === 'production') || (typeof process !== 'undefined' && process.env.NODE_ENV === 'production');
        if (isProd && 'serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then(registration => {
                console.log('SW registered:', registration);
              })
              .catch(error => {
                console.log('SW registration failed:', error);
              });
          });
        }
      } catch (e) {
        // In dev environments import.meta may be undefined inside index.html script execution contexts
        // Fallback: only register if NODE_ENV === 'production'
        try {
          if (typeof process !== 'undefined' && process.env && process.env.NODE_ENV === 'production' && 'serviceWorker' in navigator) {
            window.addEventListener('load', () => {
              navigator.serviceWorker.register('/sw.js')
                .then(registration => console.log('SW registered:', registration))
                .catch(err => console.log('SW registration failed:', err));
            });
          }
        } catch (err) {
          // ignore
        }
      }
  </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
